
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMap - Career Assessment</title>
    <style>
        body {
            background: #0b1020;
            color: white;
            font-family: Arial, sans-serif;
            padding: 25px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #171f35;
            padding: 30px;
            border-radius: 15px;
        }

        h1 { color: #91aaff; }

        label {
            display: block;
            margin-top: 20px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border-radius: 7px;
            border: 1px solid #526080;
            background: #0b1020;
            color: white;
        }

        button {
            margin-top: 25px;
            padding: 14px;
            width: 100%;
            background: #91aaff;
            border: none;
            border-radius: 7px;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>SkillMap</h1>
    <h2>Student Skill Assessment</h2>

    <p>Discover your career potential.</p>

    <form action="/analyze" method="POST">

        <label>Your Name</label>
        <input type="text" name="name"
               placeholder="Enter your name" required>

        <label>Select Your Career</label>
        <select name="career" required>
            <option value="">Choose career</option>
            <option>Python Developer</option>
            <option>Data Analyst</option>
            <option>Machine Learning Engineer</option>
            <option>Web Developer</option>
        </select>

        <label>Your Current Skills</label>
        <textarea name="skills" rows="4"
                  placeholder="Python, SQL, Excel..."
                  required></textarea>

        <button type="submit">
            Analyze My Skills
        </button>

    </form>

</div>
</body>
</html>
